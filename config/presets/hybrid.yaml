# 3-Surgeons: Hybrid Mode (Recommended)
# Cardiologist uses OpenAI API, Neurologist uses a local llama.cpp server.
# Required: OPENAI_API_KEY + llama.cpp server running on port 8080
# Run '3s init' to auto-detect your local backend and model aliases.
surgeons:
  cardiologist:
    role: "External perspective — cross-examination, evidence"
    provider: openai
    endpoint: https://api.openai.com/v1
    model: gpt-5.2
    api_key_env: OPENAI_API_KEY
  neurologist:
    role: "Local intelligence — pattern recognition, corrigibility"
    provider: llamacpp
    endpoint: http://127.0.0.1:8080/v1
    model: gpt-oss-20b

state:
  backend: sqlite
  sqlite_path: ~/.3surgeons/state.db

budgets:
  daily_external_usd: 5.0

evidence:
  db_path: ~/.3surgeons/evidence.db
