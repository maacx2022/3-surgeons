# 3-Surgeons: Local-Only Mode
# Both surgeons use local llama.cpp-backed models. No API keys needed. $0 cost.
# Works with any OpenAI-compatible /v1/chat/completions endpoint, including llama.cpp.
# Run '3s init' to auto-detect your local backend and model aliases.
surgeons:
  cardiologist:
    role: "External perspective — cross-examination, evidence"
    provider: llamacpp
    endpoint: http://127.0.0.1:8080/v1
    model: gpt-oss-20b
  neurologist:
    role: "Local intelligence — pattern recognition, corrigibility"
    provider: llamacpp
    endpoint: http://127.0.0.1:8080/v1
    model: gpt-oss-20b

state:
  backend: sqlite
  sqlite_path: ~/.3surgeons/state.db

budgets:
  daily_external_usd: 0.0

evidence:
  db_path: ~/.3surgeons/evidence.db
